# Let terminal focus events through to apps (Claude Code uses them for
# tab-away/back tracking — pausing spinners, notifications, etc.)
set -g focus-events on

# Capture the scroll wheel. tmux draws on the alternate screen, so with mouse
# mode off the wheel scrolls the TERMINAL's own scrollback (stale, pre-attach
# content) and the pane history — everything Claude printed since — is
# unreachable except via prefix+[ copy-mode. With mouse on, the wheel enters
# copy-mode and scrolls the live pane history; scrolling to the bottom drops
# back to live. Trade-off: tmux owns the mouse, so drag-selecting text in the
# terminal app needs Option-drag (iTerm2/Terminal.app).
set -g mouse on

# Long Claude sessions overflow the 2000-line default pane history fast.
set -g history-limit 50000

# Make every copy path reach the SYSTEM clipboard (Cmd+V), not just tmux's.
#
# Claude Code chooses its copy strategy ONCE, at process start: macOS and not
# SSH => pbcopy ("native"); otherwise, inside tmux, `tmux set-buffer`
# ("tmux-buffer" — reachable only via prefix + ], never Cmd+V). Its SSH test is
# SSH_CONNECTION in its OWN process environment, captured at spawn — so a slot
# created while a phone/Tailscale client was attached keeps copying into the
# tmux buffer FOREVER, even after you re-attach locally in Terminal.app. That is
# why copy works in most sessions and silently fails in a few; the failing set
# is just "whichever slots were born over ssh", which looks random.
#
# Mirroring the buffer sidesteps the staleness instead of fighting it: whichever
# strategy a session picked, the text still lands on the system clipboard — and
# it fixes already-running sessions, which no env change can.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  # Every copy-mode copy (drag, double/triple click, M-w, C-w) runs
  # `copy-pipe-and-cancel` with no argument, which pipes to copy-command.
  # One option covers them all — and covers the emacs AND vi key tables, so it
  # cannot silently miss the one `mode-keys` actually selects.
  set -g copy-command 'pbcopy'

  # copy-mode sets its buffer internally and does NOT fire these hooks (verified),
  # which is why copy-command above is needed as well. These catch the buffer
  # being set from OUTSIDE copy-mode — Claude Code's "tmux-buffer" strategy, and
  # tmux's own right-click Copy Line / Copy Word menu items.
  set-hook -g after-set-buffer  'run-shell -b "tmux save-buffer - | pbcopy"'
  set-hook -g after-load-buffer 'run-shell -b "tmux save-buffer - | pbcopy"'
}
